[project]
name = "nawat"
version = "0.2.0"
description = "Fine-tune on a small disk as if it were a big one — object-storage-backed cache, runs and serving for Unsloth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]
license = { file = "LICENSE" }
keywords = ["unsloth", "fine-tuning", "lora", "s3", "object-storage", "mlops"]
classifiers = [
    # PolyForm Noncommercial 1.0.0 is deliberately not an OSI-approved licence:
    # it restricts the field of use, which the Open Source Definition forbids.
    # Claiming an OSI classifier here would misrepresent it.
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/murtadha-lap/nawat"
Source = "https://github.com/murtadha-lap/nawat"
Issues = "https://github.com/murtadha-lap/nawat/issues"

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
notebook = ["huggingface_hub>=0.23", "matplotlib>=3.8"]

[project.scripts]
nawat = "nawat.cli:main"

[dependency-groups]
dev = ["pyflakes>=3.2"]

[tool.uv]
required-version = ">=0.5"

# Nawāt drives NVIDIA GPUs through Unsloth and vLLM and supervises them with
# systemd, so Linux is the only platform it claims. Saying so keeps the lock to
# the wheels that can actually be installed here.
environments = ["sys_platform == 'linux'"]

# Torch, Unsloth and vLLM are deliberately absent from this project. They are
# gigabytes of CUDA-specific wheels whose correct combination depends on the
# card in the machine, and nothing in the package imports them — the trainer and
# the inference server are subprocesses. Install them into the same environment
# with `uv pip install` (see the README), and keep them there across a later
# `uv sync --inexact`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nawat"]

[tool.hatch.build.targets.sdist]
# The logo and the social preview are 2.5 MB of images that render from the
# repository and from nowhere else — a source distribution is not a web page.
exclude = [".github", "docs", "unsloth_compiled_cache"]
