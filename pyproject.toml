[project]
name = "nawat"
version = "0.1.0"
description = "Fine-tune on a small disk as if it were a big one — object-storage-backed cache, runs and serving for Unsloth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]
license = { file = "LICENSE" }
keywords = ["unsloth", "fine-tuning", "lora", "s3", "object-storage", "mlops"]
classifiers = [
    # PolyForm Noncommercial 1.0.0 is deliberately not an OSI-approved licence:
    # it restricts the field of use, which the Open Source Definition forbids.
    # Claiming an OSI classifier here would misrepresent it.
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/murtadha-lap/nawat"
Source = "https://github.com/murtadha-lap/nawat"
Issues = "https://github.com/murtadha-lap/nawat/issues"

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
agent = ["claude-agent-sdk>=0.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
notebook = ["huggingface_hub>=0.23", "matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "moto[s3,server]>=5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
nawat = "nawat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nawat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
