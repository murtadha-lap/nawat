[project]
name = "nawat"
version = "0.1.0"
description = "Self-hosted fine-tuning and serving platform for storage-constrained GPU hosts"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = [
    "pytest>=8",
    "moto[s3,server]>=5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
nawat = "nawat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nawat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
