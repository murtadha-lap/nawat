<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nawāt</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230F1620'/><circle cx='8' cy='8' r='3' fill='%23C9A227'/></svg>">
</head>
<body>
  <div id="frame">
    <aside id="rail">
      <div class="wordmark">NAWĀT <span>نواة</span></div>
      <nav id="nav"></nav>
      <div class="foot">
        <a id="jupyter-link" href="#" hidden target="_blank" rel="noopener">JupyterLab ↗</a>
      </div>
    </aside>
    <main id="main"></main>
    <footer id="strip">
      <span class="cell" id="strip-cache" title="Local cache against its ceiling"></span>
      <span class="cell" id="strip-gpu"></span>
      <span class="cell" id="strip-session"></span>
      <span class="cell" id="strip-run"></span>
      <span class="cell alarm" id="strip-alerts"></span>
    </footer>
  </div>

  <div id="gate">
    <form id="gate-form">
      <p class="eyebrow">Nawāt</p>
      <h1>Access token</h1>
      <p class="muted" style="margin-bottom:16px">This control plane requires a token. It is the value of
        <span class="mono">NAWAT_API_TOKEN</span> on the host.</p>
      <input type="text" id="gate-token" autocomplete="off" spellcheck="false">
      <div class="actions"><button type="submit">Enter</button></div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
