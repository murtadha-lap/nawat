# Unsloth nb/Zephyr_(7B)-DPO.ipynb — DPO on 0.5 % of UltraFeedback-binarized.
[preset]
backbone    = "dpo"
description = "Preference tuning with DPO (Zephyr DPO notebook)"
model       = "models/unsloth/zephyr-sft-bnb-4bit"
dataset     = "datasets/HuggingFaceH4/ultrafeedback_binarized"

[blocks]
model    = "llm-lora"
dataset  = "preference-pairs"
template = "chat-template"
export   = ["adapter"]

[params.model]
max_seq_length = 4096
load_in_4bit   = true
r              = 64
lora_alpha     = 64

[params.dataset]
split       = "train_prefs"
max_samples = 306

[params.template]
train_on_responses_only = false
fallback_template = "{% for message in messages %}\n{% if message['role'] == 'user' %}\n{{ '<|user|>\n' + message['content'] + eos_token }}\n{% elif message['role'] == 'system' %}\n{{ '<|system|>\n' + message['content'] + eos_token }}\n{% elif message['role'] == 'assistant' %}\n{{ '<|assistant|>\n'  + message['content'] + eos_token }}\n{% endif %}\n{% if loop.last and add_generation_prompt %}\n{{ '<|assistant|>' }}\n{% endif %}\n{% endfor %}"
